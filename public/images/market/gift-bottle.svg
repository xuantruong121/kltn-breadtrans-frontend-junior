<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="gb-aura" cx="80" cy="85" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gb-body" x1="55" y1="50" x2="105" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="gb-cap" x1="60" y1="25" x2="100" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="gb-shadow" x="35" y="15" width="90" height="135" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#075985" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="85" r="58" fill="url(#gb-aura)"/>

  <g filter="url(#gb-shadow)">
    <!-- Flask Lid Carry Loop -->
    <path d="M72 26C72 18 88 18 88 26" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

    <!-- Brushed Stainless Cap -->
    <rect x="66" y="26" width="28" height="12" rx="3" fill="url(#gb-cap)"/>
    <rect x="64" y="38" width="32" height="4" rx="1.5" fill="#334155"/>

    <!-- Flask Neck Transition -->
    <path d="M64 42C64 46 60 50 58 56H102C100 50 96 42 96 42H64Z" fill="#0369A1"/>

    <!-- Main Insulated Cylinder Body -->
    <rect x="58" y="56" width="44" height="74" rx="8" fill="url(#gb-body)"/>

    <!-- Specular Highlight Curve on Metal -->
    <rect x="66" y="58" width="6" height="70" rx="3" fill="#FFFFFF" opacity="0.45"/>

    <!-- Laser Engraved BreadTrans Insignia -->
    <circle cx="80" cy="82" r="9" fill="#075985" opacity="0.6"/>
    <path d="M75 80C75 76 78 74 82 74C86 74 89 76 89 80C89 82 88 85 86 86C84 87 77 87 75 86Z" fill="#E0F2FE"/>
    <line x1="78" y1="78" x2="80" y2="82" stroke="#0284C7" stroke-width="1"/>
    <line x1="82" y1="77" x2="83" y2="82" stroke="#0284C7" stroke-width="1"/>

    <!-- Temperature Ring / Capacity Text -->
    <text x="80" y="104" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="800" font-size="7" fill="#E0F2FE" letter-spacing="1">BREADTRANS</text>
    <text x="80" y="113" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="700" font-size="6" fill="#BAE6FD" letter-spacing="0.5">500ML - 12H HOT</text>
  </g>
</svg>