<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="fo-aura" cx="80" cy="80" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFEDD5" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FB923C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fo-orange" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#F97316"/>
      <stop offset="70%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="fo-shadow" x="10" y="10" width="140" height="140" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#C2410C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="80" r="68" fill="url(#fo-aura)"/>

  <g filter="url(#fo-shadow)">
    <!-- Main Dynamic Orange Bevel Ring -->
    <circle cx="80" cy="80" r="54" stroke="url(#fo-orange)" stroke-width="7"/>
    <!-- High-energy Inner Ring -->
    <circle cx="80" cy="80" r="47" stroke="#FFF7ED" stroke-width="1.8" opacity="0.85"/>

    <!-- Orbital Kinetic Dashes -->
    <circle cx="80" cy="80" r="61" stroke="#F97316" stroke-width="2" stroke-dasharray="14 8 4 8" opacity="0.85"/>

    <!-- 4 Energy Compass Nodes -->
    <!-- Top Node -->
    <rect x="76" y="18" width="8" height="8" rx="2" fill="#F97316" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(45 80 22)"/>
    <!-- Bottom Node -->
    <rect x="76" y="130" width="8" height="8" rx="2" fill="#F97316" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(45 80 134)"/>
    <!-- Left Node -->
    <rect x="18" y="76" width="8" height="8" rx="2" fill="#F97316" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(45 22 80)"/>
    <!-- Right Node -->
    <rect x="130" y="76" width="8" height="8" rx="2" fill="#F97316" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(45 134 80)"/>

    <!-- Kinetic Wing Accents (Top Right & Bottom Left) -->
    <path d="M124 36L138 22M130 42L144 28" stroke="#FB923C" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 124L22 138M42 130L28 144" stroke="#FB923C" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>