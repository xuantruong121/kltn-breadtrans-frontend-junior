<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="bm-aura" cx="80" cy="72" r="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bm-ribbon-l" x1="45" y1="80" x2="35" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="bm-ribbon-r" x1="115" y1="80" x2="125" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="bm-gold-rim" x1="40" y1="30" x2="120" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="bm-sapphire" x1="80" y1="40" x2="80" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="70%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="bm-shadow" x="15" y="15" width="130" height="135" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E3A8A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="72" r="54" fill="url(#bm-aura)"/>

  <g filter="url(#bm-shadow)">
    <!-- Silk Ribbons with Gold Trim -->
    <path d="M62 88L40 138L58 132L72 138L68 96Z" fill="url(#bm-ribbon-l)"/>
    <path d="M42 136L40 138L58 132L60 130" stroke="#FBBF24" stroke-width="2.5"/>

    <path d="M98 88L120 138L102 132L88 138L92 96Z" fill="url(#bm-ribbon-r)"/>
    <path d="M118 136L120 138L102 132L100 130" stroke="#FBBF24" stroke-width="2.5"/>

    <!-- Gold Scalloped / Starburst Edge Medallion -->
    <circle cx="80" cy="72" r="44" fill="url(#bm-gold-rim)"/>

    <!-- Deep Sapphire Enamel Inlay -->
    <circle cx="80" cy="72" r="38" fill="url(#bm-sapphire)"/>
    <circle cx="80" cy="72" r="35" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 2" opacity="0.6"/>

    <!-- Golden Laurel Wreath (Left) -->
    <path d="M52 70C52 60 58 52 64 48" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="51" cy="62" rx="3.5" ry="2" fill="#FBBF24" transform="rotate(-30 51 62)"/>
    <ellipse cx="54" cy="54" rx="3.5" ry="2" fill="#FDE047" transform="rotate(-50 54 54)"/>
    <ellipse cx="61" cy="48" rx="3.5" ry="2" fill="#FEF08A" transform="rotate(-70 61 48)"/>

    <!-- Golden Laurel Wreath (Right) -->
    <path d="M108 70C108 60 102 52 96 48" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="109" cy="62" rx="3.5" ry="2" fill="#FBBF24" transform="rotate(30 109 62)"/>
    <ellipse cx="106" cy="54" rx="3.5" ry="2" fill="#FDE047" transform="rotate(50 106 54)"/>
    <ellipse cx="99" cy="48" rx="3.5" ry="2" fill="#FEF08A" transform="rotate(70 99 48)"/>

    <!-- Open Lexicon / Book Emblem in Center -->
    <path d="M80 66C74 62 66 62 60 64V84C66 82 74 82 80 86V66Z" fill="#FEF08A"/>
    <path d="M80 66C86 62 94 62 100 64V84C94 82 86 82 80 86V66Z" fill="#FDE047"/>
    <path d="M80 66V86" stroke="#B45309" stroke-width="1.8"/>

    <!-- Radiant Star Emanating Above Book -->
    <polygon points="80,50 82,55 87,55 83,58 85,63 80,60 75,63 77,58 73,55 78,55" fill="#FFFFFF"/>
  </g>
</svg>