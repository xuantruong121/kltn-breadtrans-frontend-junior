<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="nb-aura" cx="80" cy="85" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nb-cover" x1="40" y1="30" x2="120" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="40%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="nb-spine" x1="36" y1="30" x2="48" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="nb-gold" x1="60" y1="50" x2="100" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="nb-shadow" x="20" y="20" width="120" height="125" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="85" r="58" fill="url(#nb-aura)"/>

  <g filter="url(#nb-shadow)">
    <!-- Back Cover Shadow Edge -->
    <rect x="42" y="32" width="76" height="96" rx="8" fill="#091E42"/>

    <!-- Ivory Paper Block Edge -->
    <rect x="46" y="30" width="74" height="96" rx="6" fill="#F8FAFC"/>
    <path d="M116 34V122M118 36V120M120 38V118" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Front Hardcover (Navy Leatherette) -->
    <rect x="40" y="28" width="74" height="96" rx="7" fill="url(#nb-cover)"/>

    <!-- Stitched Spine Binding Strip -->
    <path d="M40 28H48V124H40C36 124 34 122 34 118V34C34 30 36 28 40 28Z" fill="url(#nb-spine)"/>
    <line x1="48" y1="28" x2="48" y2="124" stroke="#0F172A" stroke-width="1"/>

    <!-- Golden Stitched Margin Lines -->
    <line x1="53" y1="32" x2="53" y2="120" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.75"/>

    <!-- Embossed Gold Foil BreadTrans Emblem -->
    <!-- Bread Loaf Logo Icon -->
    <path d="M68 62C68 54 74 50 82 50C90 50 96 54 96 62C96 66 94 72 90 75C86 77 74 77 70 75C68 72 68 66 68 62Z"
          fill="url(#nb-gold)"/>
    <path d="M72 56L75 62M80 54L82 62M88 56L86 62" stroke="#FFFBEB" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Embossed Vocabulary Gold Text -->
    <rect x="66" y="82" width="32" height="3" rx="1.5" fill="url(#nb-gold)"/>
    <rect x="70" y="88" width="24" height="2.5" rx="1.2" fill="url(#nb-gold)" opacity="0.8"/>

    <!-- Golden Silk Bookmark Ribbon Falling Down -->
    <path d="M82 28V134L88 128L94 134V28H82Z" fill="#F59E0B"/>
    <path d="M82 28V134L85 131V28H82Z" fill="#FDE047" opacity="0.6"/>

    <!-- Elastic Band Closer (Right edge) -->
    <rect x="104" y="28" width="5" height="96" rx="2" fill="#0284C7" opacity="0.9"/>
  </g>
</svg>