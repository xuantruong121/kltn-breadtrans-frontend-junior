<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="gp-aura" cx="80" cy="85" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FDE68A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gp-fur" cx="72" cy="72" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <linearGradient id="gp-ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="gp-shadow" x="20" y="20" width="120" height="125" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#78350F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Warm Aura -->
  <circle cx="80" cy="85" r="58" fill="url(#gp-aura)"/>

  <g filter="url(#gp-shadow)">
    <!-- Round Plushie Ears (Back) -->
    <circle cx="48" cy="46" r="14" fill="url(#gp-ear)"/>
    <circle cx="48" cy="46" r="8" fill="#FDE68A" opacity="0.75"/>
    <circle cx="112" cy="46" r="14" fill="url(#gp-ear)"/>
    <circle cx="112" cy="46" r="8" fill="#FDE68A" opacity="0.75"/>

    <!-- Main Baked Bread Loaf Head/Body -->
    <rect x="36" y="44" width="88" height="76" rx="34" fill="url(#gp-fur)"/>

    <!-- Loaf Top Scoring Seams (Embroidery stitches) -->
    <path d="M52 46C60 42 70 42 78 44" stroke="#FFFBEB" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>
    <path d="M82 44C90 42 100 42 108 46" stroke="#FFFBEB" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>

    <!-- Snout Muzzle Area -->
    <ellipse cx="80" cy="84" rx="20" ry="14" fill="#FEF3C7"/>

    <!-- Shiny Button Eyes -->
    <circle cx="62" cy="74" r="5.5" fill="#1E293B"/>
    <circle cx="60.5" cy="72" r="2" fill="#FFFFFF"/>
    <circle cx="98" cy="74" r="5.5" fill="#1E293B"/>
    <circle cx="96.5" cy="72" r="2" fill="#FFFFFF"/>

    <!-- Cute Plush Nose & Embroidered Mouth -->
    <path d="M76 80H84L80 85Z" fill="#78350F"/>
    <path d="M75 85C77 88 80 87 80 85C80 87 83 88 85 85" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>

    <!-- Rosy Stitched Cheeks -->
    <ellipse cx="48" cy="84" rx="7" ry="5" fill="#F43F5E" opacity="0.45"/>
    <ellipse cx="112" cy="84" rx="7" ry="5" fill="#F43F5E" opacity="0.45"/>

    <!-- Cute Front Paws Holding a Heart/Bread Crumb -->
    <ellipse cx="62" cy="112" rx="10" ry="7" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
    <ellipse cx="98" cy="112" rx="10" ry="7" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>

    <!-- Authentic Plushie Fabric Tag on Side -->
    <path d="M124 94H134V104H124" fill="#EF4444" rx="2"/>
    <text x="129" y="101" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="6" fill="#FFFFFF">BT</text>
  </g>
</svg>