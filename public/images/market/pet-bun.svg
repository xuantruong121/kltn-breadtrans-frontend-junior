<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="bun-aura" cx="80" cy="90" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FDE047" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bun-head" cx="72" cy="75" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="45%" stop-color="#FDE047"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <linearGradient id="bun-ear-l" x1="45" y1="20" x2="55" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bun-ear-r" x1="105" y1="20" x2="115" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bun-inner-ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="bun-shadow" x="20" y="15" width="120" height="135" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#B45309" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="90" r="58" fill="url(#bun-aura)"/>

  <!-- Main Mascot Group -->
  <g filter="url(#bun-shadow)">
    <!-- Left Ear (Back) -->
    <path d="M48 65C38 52 38 28 50 20C60 14 68 32 64 58Z"
          fill="url(#bun-ear-l)"/>
    <path d="M49 52C43 44 44 30 50 26C56 22 59 32 57 48Z"
          fill="url(#bun-inner-ear)" opacity="0.65"/>

    <!-- Right Ear (Back) -->
    <path d="M112 65C122 52 122 28 110 20C100 14 92 32 96 58Z"
          fill="url(#bun-ear-r)"/>
    <path d="M111 52C117 44 116 30 110 26C104 22 101 32 103 48Z"
          fill="url(#bun-inner-ear)" opacity="0.65"/>

    <!-- Bread Bun Body / Head -->
    <ellipse cx="80" cy="88" rx="46" ry="38" fill="url(#bun-head)"/>

    <!-- 3D Cheek Spheres -->
    <circle cx="50" cy="96" r="10" fill="#F43F5E" opacity="0.35"/>
    <circle cx="110" cy="96" r="10" fill="#F43F5E" opacity="0.35"/>

    <!-- Large Anime Eyes -->
    <!-- Left Eye -->
    <ellipse cx="62" cy="82" rx="6.5" ry="8.5" fill="#1E293B"/>
    <circle cx="60" cy="78.5" r="3.2" fill="#FFFFFF"/>
    <circle cx="65" cy="85" r="1.5" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="98" cy="82" rx="6.5" ry="8.5" fill="#1E293B"/>
    <circle cx="96" cy="78.5" r="3.2" fill="#FFFFFF"/>
    <circle cx="101" cy="85" r="1.5" fill="#FFFFFF"/>

    <!-- Tiny Cute Nose & Mouth -->
    <ellipse cx="80" cy="88" rx="3" ry="2" fill="#B45309"/>
    <path d="M74 92C77 95 80 94 80 92C80 94 83 95 86 92" stroke="#92400E" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Baker's Star Hairpin on Ear -->
    <polygon points="46,38 49,44 56,44 50,48 52,55 46,51 40,55 42,48 36,44 43,44" fill="#FFFFFF"/>
    <circle cx="46" cy="46" r="1.8" fill="#F59E0B"/>

    <!-- Tiny Student Bowtie / Collar -->
    <path d="M72 120L80 123L88 120L85 128L80 125L75 128Z" fill="#0284C7"/>
    <circle cx="80" cy="123" r="2.5" fill="#38BDF8"/>
  </g>
</svg>